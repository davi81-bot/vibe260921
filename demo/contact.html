    <a class="brand" href="index.html" aria-label="윤현석 건축가 홈">

      <a href="contact.html" aria-current="page">문의</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="container page-head">
    <p class="eyebrow">Contact</p>
    <h1>문의</h1>
    <p class="lede">프로젝트 의뢰, 협업 제안, 설계 자동화 상담, 강연·교육, 채용 문의를 받습니다.</p>
  </div>

  <section class="section" style="border-top:0;padding-top:0">
    <div class="container contact-grid">
      <div>
        <h2>이메일</h2>
        <a class="email-big" href="mailto:davidoff1126@gmail.com">davidoff1126@gmail.com</a>
        <button class="btn" type="button" id="copy-email">주소 복사</button>
        <p class="form-note">보내 주신 내용은 문의에 답하는 용도로만 사용합니다.</p>
      </div>

      <form id="contact-form">
        <h2>메일 작성</h2>
        <div class="field">
          <label for="f-name">이름</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-email">회신받을 이메일</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-type">문의 유형</label>
          <select id="f-type" name="type">
            <option>프로젝트 의뢰</option>
            <option>협업 제안</option>
            <option>설계 자동화 상담</option>
            <option>강연·교육</option>
            <option>채용</option>
            <option>기타</option>
          </select>
        </div>
        <div class="field">
          <label for="f-message">내용</label>
          <textarea id="f-message" name="message" required></textarea>
        </div>
        <button class="btn btn--primary" type="submit">메일 프로그램으로 보내기</button>
        <p class="form-note">이 사이트에는 서버가 없어서, 입력한 내용으로 사용 중인 메일 프로그램의 새 메일 창을 엽니다.</p>
        <p class="status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
